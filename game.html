<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Блекаут — прототип</title>
<style>
  .app{padding:calc(10px + var(--safe-area-inset-top,0px)) 10px calc(118px + var(--safe-area-inset-bottom,0px))!important}
  .toast{top:calc(12px + var(--safe-area-inset-top,0px))!important}
  .hudtop{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
  .hero{position:relative;width:62px;height:62px;flex:none;border:0;padding:0;background:none;cursor:pointer}
  .hero .rings{position:absolute;inset:0;width:62px;height:62px}
  .hero img{position:absolute;left:8px;top:6px;width:46px;height:48px;border-radius:50%;object-fit:cover;object-position:50% 10%;background:#f5e6cc}
  .hcol{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;overflow:hidden}
  .pill{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;background:rgba(16,18,24,.85);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:4px 12px 4px 5px;font-weight:900;font-size:17px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  .coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 32% 26%,#fff6c0,#ffd23f 55%,#d9a600);color:#1a1400;display:flex;align-items:center;justify-content:center;font-size:12px}
  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip2{font-size:11px;font-weight:800;padding:2px 8px;border-radius:9px;background:rgba(16,18,24,.85);border:1px solid rgba(255,255,255,.12);color:#fff;cursor:pointer;white-space:nowrap}
  .cn{color:#9ff0c2}.cf{color:#f3cf98}
  .work{align-self:flex-start;color:#c7ccd6}
  .clockpill{background:rgba(16,18,24,.85);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:6px 10px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;box-shadow:0 4px 12px rgba(0,0,0,.35);flex:none}
  .crow{display:flex;align-items:center;gap:6px}
  .crow b{font-size:19px;font-weight:900}
  .crow svg{width:16px;height:16px}
  .clockpill .sched{display:flex!important;gap:2px;margin:0!important;cursor:pointer}
  .clockpill .sched div{width:4px!important;height:8px!important;border-radius:2px;background:#4a4f5c}
  .clockpill .sched div.l{background:#c9a930}
  .clockpill .sched div.now{outline:1.5px solid #fff;outline-offset:0}
  .clockpill .sched div.chg{background:#ff9f43}
  .clockpill .sched div.night{opacity:.45}
  .cnext{font-size:10px;font-weight:800;color:#a9afbb;white-space:nowrap}
  .quest{display:flex!important;align-items:center;gap:8px;background:none!important;border:0!important;padding:0!important;margin-bottom:8px;cursor:pointer}
  .qav{position:relative;width:52px;height:52px;flex:none;border-radius:50%;border:3px solid #ffd23f;background:#f5e6cc;box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .qav img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 10%;display:block}
  .qbadge{position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;background:#ff7a2f;color:#fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #161921}
  .qbub{flex:1;min-width:0;background:#fff7d6;color:#3a2c00;border-radius:4px 16px 16px 16px;padding:6px 11px 7px;box-shadow:0 4px 12px rgba(0,0,0,.35);position:relative;overflow:hidden}
  .qbub::after{content:'';position:absolute;top:-60%;left:-70%;width:40%;height:220%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:rotate(18deg);animation:gloss 4s ease-in-out infinite;pointer-events:none}
  .quest .qn{font-size:10px!important;color:#8a6a00!important;font-weight:900}
  .quest .qt{font-size:14px!important;font-weight:900;margin-top:1px}
  .qbar{height:5px;border-radius:3px;background:rgba(58,44,0,.15);overflow:hidden;margin-top:5px}
  .qbar i{display:block;height:5px;background:#e0a800;width:0;transition:width .5s}
  .quest .qp{color:#ffd23f!important;font-weight:900;font-size:13px;min-width:36px;text-align:center}
  .quest.done .qbub{animation:qd .9s}
  .rail{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:2}
  .rb{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.4),rgba(255,255,255,0) 46%),rgba(22,25,33,.85);display:flex;align-items:center;justify-content:center;color:#fff;position:relative;box-shadow:0 5px 14px rgba(0,0,0,.45);padding:0;cursor:pointer;font:900 14px Nunito,system-ui,sans-serif;transition:transform .12s}
  .rb:active{transform:scale(.92)}
  .rb svg{width:22px;height:22px}
  .rb.on{background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.6),rgba(255,255,255,0) 46%),#ffd23f;color:#1a1400;border-color:#fff3b0}
  .rb.hidden{display:none}
  .rb .badge{align-items:center;justify-content:center;top:-5px;right:-6px;min-width:18px;height:18px;padding:0 4px;font-size:10px;border:2px solid #161921}
  .offerwrap{display:none;align-items:center;gap:6px}
  .offerwrap.show{display:flex}
  .offerlbl{background:#fff;color:#3a1a00;font-weight:900;font-size:11px;padding:5px 9px;border-radius:12px;max-width:150px;box-shadow:0 4px 10px rgba(0,0,0,.35);line-height:1.2}
  .rb.ev{width:52px;height:52px;background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.45),rgba(255,255,255,0) 46%),#ff7a2f;border-color:#ffd9b8;animation:evp 1.6s ease-in-out infinite}
  @keyframes evp{0%,100%{box-shadow:0 0 0 0 rgba(255,122,47,.5),0 6px 14px rgba(0,0,0,.45)}50%{box-shadow:0 0 0 9px rgba(255,122,47,0),0 6px 14px rgba(0,0,0,.45)}}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none}
  .dock .in{pointer-events:auto;max-width:440px;margin:0 auto calc(12px + var(--safe-area-inset-bottom,0px));position:relative;height:96px}
  .dock .bg{position:absolute;left:8px;right:8px;bottom:0;height:76px;border-radius:28px;background:linear-gradient(180deg,rgba(30,34,45,.97),rgba(14,16,22,.99));border:1px solid rgba(255,255,255,.12);box-shadow:0 -6px 20px rgba(0,0,0,.4)}
  .dock .row{position:absolute;left:8px;right:8px;bottom:6px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end}
  .dock .cell{display:flex;flex-direction:column;align-items:center}
  .dock .rb{width:48px;height:48px;background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.38),rgba(255,255,255,0) 46%),#2a2f3d}
  .dock .lbl{font-size:10px;font-weight:900;color:#c7ccd6;margin-top:3px}
  .dock .big{width:72px;height:72px;margin-bottom:-2px;background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.6),rgba(255,255,255,0) 46%),#ffd23f;color:#1a1400;border:4px solid #161921;box-shadow:0 0 0 2px #ffd23f,0 8px 18px rgba(0,0,0,.5)}
  .dock .big svg{width:30px;height:30px}
  .dock .big.warn{animation:warn2 1s ease-in-out infinite}
  @keyframes warn2{50%{box-shadow:0 0 0 2px #ff5a5f,0 0 0 10px rgba(255,90,95,.3)}}
  .dock .shop{background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.55),rgba(255,255,255,0) 46%),#3a3220;color:#ffd23f}
  .picker{position:fixed;left:50%;bottom:calc(118px + var(--safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px) scale(.9);display:flex;gap:14px;z-index:7;opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.2,.9,.3,1.2)}
  .picker.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1)}
  .picker .cell{display:flex;flex-direction:column;align-items:center;gap:3px}
  .picker .tab{width:56px!important;height:56px;flex:none!important;border-radius:50%!important;padding:0!important;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.25)!important;background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.4),rgba(255,255,255,0) 46%),rgba(22,25,33,.95)!important;color:#fff!important;box-shadow:0 6px 16px rgba(0,0,0,.5)!important}
  .picker .tab svg{width:24px;height:24px}
  .picker .tab.on{background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.6),rgba(255,255,255,0) 46%),#ffd23f!important;color:#1a1400!important}
  .picker .tab.hidden{display:none!important}
  .picker .cap{font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000}
  .room .hint{bottom:8px}
  .msgpop{right:62px!important}

  :root{--bg:#0f1115;--panel:#1a1d24;--panel2:#232733;--text:#eef0f4;--muted:#9aa1ad;--yellow:#ffd23f;--green:#3ddc84;--red:#ff5a5f;--blue:#4da3ff;--orange:#ff9f43;--viber:#7360f2}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  .app{max-width:460px;margin:0 auto;padding:10px 10px 84px}
  .top{display:flex;justify-content:space-between;gap:6px}
  .chip{background:var(--panel);border-radius:12px;padding:7px 10px;font-weight:700;font-size:14px;white-space:nowrap}
  .chip.btnchip{cursor:pointer;border:0;color:var(--text)}
  .sched{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin:8px 0 0}
  .sched div{height:10px;border-radius:2px;background:#2b2f3a}
  .sched div.l{background:#c9a930}
  .sched div.now{outline:2px solid #fff;outline-offset:1px}
  .status{display:flex;justify-content:space-between;align-items:center;margin:8px 0 6px;font-size:13px}
  .status b{font-size:15px}
  /* gloss & glow */
  .gloss{position:relative;overflow:hidden}
  .gloss::after{content:'';position:absolute;top:-60%;left:-70%;width:45%;height:220%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:rotate(18deg);animation:gloss 3.4s ease-in-out infinite;pointer-events:none}
  @keyframes gloss{0%{left:-70%}55%,100%{left:140%}}
  .softpulse{animation:softpulse 2.2s ease-in-out infinite}
  @keyframes softpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,210,63,0)}50%{box-shadow:0 0 18px 3px rgba(255,210,63,.45)}}
  .quest{background:linear-gradient(90deg,#2a2440,#1a1d24);border:1px solid #3b3360;border-radius:14px;padding:9px 12px;margin-bottom:8px;font-size:13px;display:flex;gap:10px;align-items:center;cursor:pointer}
  .quest .qn{font-size:11px;color:#b9b0ff;font-weight:800;letter-spacing:.3px}
  .quest .qt{font-weight:800;font-size:14px;margin-top:2px}
  .quest .qp{margin-left:auto;font-weight:800;color:var(--yellow);white-space:nowrap}
  .quest.done{animation:qd .9s}
  @keyframes qd{30%{background:#2f6a45;border-color:#3ddc84;box-shadow:0 0 24px rgba(61,220,132,.6)}}
  .tabs{display:flex;gap:6px;margin-bottom:8px}
  .tab{flex:1;border:0;border-radius:12px;padding:9px;font-weight:800;font-size:14px;background:var(--panel);color:var(--muted);cursor:pointer;position:relative;transition:background .25s,color .25s}
  .tab.on{background:#2b2f3a;color:var(--text);box-shadow:inset 0 -3px 0 var(--yellow)}
  .tab.warn{animation:warn 1s ease-in-out infinite}
  @keyframes warn{50%{background:#5a2328;color:#fff}}
  .tab.hidden{display:none}
  .room{position:relative;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  .room svg{display:block;width:100%;height:auto}
  .hint{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:700;text-align:center;padding:7px;border-radius:10px;pointer-events:none;transition:opacity .35s}
  .msgpop{position:absolute;left:8px;right:8px;top:8px;background:#fff;color:#111;border-radius:14px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start;font-size:13px;transform:translateY(-130%);transition:transform .4s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 4px 14px rgba(0,0,0,.4);cursor:pointer;z-index:3}
  .msgpop.show{transform:translateY(0)}
  .msgpop.info{background:#fffbe8;border:2px solid #ffd23f}
  .msgpop .av{font-size:24px;line-height:1}
  .msgpop b{display:block;font-size:12px;color:var(--viber)}
  .msgpop.info b{color:#8a6a00}
  .hud{display:flex;gap:6px;margin-top:8px}
  .hud .box{flex:1;background:var(--panel);border-radius:12px;padding:8px;font-size:12px;color:var(--muted);position:relative}
  .hud .box b{display:block;color:var(--text);font-size:14px;margin-top:2px}
  .bar{height:8px;background:#2b2f3a;border-radius:6px;overflow:hidden;margin-top:5px}
  .bar>i{display:block;height:100%;width:50%;background:var(--green);transition:width .3s ease,background .4s}
  .nfloat{position:absolute;left:8px;top:-4px;font-size:12px;font-weight:900;padding:2px 7px;border-radius:8px;pointer-events:none;animation:nf 2s ease-out forwards;white-space:nowrap;z-index:4}
  .nfloat.minus{background:#5a2328;color:#ffb3b5}.nfloat.plus{background:#1e4d33;color:#a6f3c6}
  @keyframes nf{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:translateY(-14px)}80%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
  .btn{border:0;border-radius:12px;padding:10px 12px;font-weight:800;font-size:14px;background:var(--panel2);color:var(--text);cursor:pointer;position:relative;transition:transform .12s}
  .btn:active{transform:scale(.96)}
  .btn.big{width:100%;padding:14px;font-size:16px;background:var(--yellow);color:#1a1400;margin-top:12px}
  .btn.ghost{background:var(--panel2)}
  .btn.buy{background:var(--yellow);color:#1a1400}
  .badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:2px 6px;display:none}
  .bottom{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:16px 10px 12px;z-index:5}
  .bottom .in{max-width:460px;margin:0 auto;display:flex;gap:6px}
  .bottom .btn{flex:1;padding:13px 4px;font-size:13px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:20;padding:14px;opacity:0;pointer-events:none;transition:opacity .25s}
  .modal.show{opacity:1;pointer-events:auto}
  .card{background:var(--panel);border-radius:20px;padding:16px;width:100%;max-width:420px;max-height:92vh;overflow:auto;transform:scale(.94) translateY(10px);transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
  .modal.show .card{transform:none}
  .card h2{margin:0 0 4px;font-size:20px}
  .card p{margin:4px 0 10px;color:var(--muted);font-size:14px}
  .shopitem{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:14px;padding:10px;margin-top:8px}
  .shopitem .ic{font-size:26px}.shopitem .mid{flex:1}
  .shopitem b{display:block;font-size:14px}.shopitem span{font-size:12px;color:var(--muted)}
  .shopsec{font-size:12px;font-weight:800;color:var(--muted);margin:14px 0 2px;letter-spacing:.4px}
  .toast{position:fixed;top:12px;left:50%;transform:translateX(-50%) translateY(-120px);background:#fff;color:#111;padding:10px 14px;border-radius:12px;font-weight:700;font-size:14px;z-index:30;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);max-width:90%;text-align:center}

  /* spotlight */
  #spot{position:fixed;border-radius:16px;pointer-events:none;z-index:15;opacity:0;transition:opacity .35s,left .3s ease,top .3s ease,width .3s ease,height .3s ease;box-shadow:0 0 0 9999px rgba(4,5,10,.5);border:2px solid rgba(255,226,120,.95);overflow:hidden}

  #spotTip.above::after{bottom:-14px;border-top-color:#fff7d6}

  /* svg */
  .hit{fill:transparent;cursor:pointer}
  .glowpulse{animation:gp 1.8s ease-in-out infinite;filter:drop-shadow(0 0 4px rgba(255,210,63,.9))}
  @keyframes gp{0%,100%{opacity:.55}50%{opacity:1}}
  .flame{transform-box:fill-box;transform-origin:center bottom;animation:flick .35s ease-in-out infinite alternate}

  .zap{animation:zap 1.4s ease-in-out infinite}

  .zz{animation:zz 2s ease-in-out infinite}
  @keyframes zz{50%{opacity:.2;transform:translateY(-4px)}}
  .steam{animation:steam 1.2s ease-out infinite;transform-box:fill-box}
  @keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
  .mini{border:0;border-radius:10px;padding:5px 9px;font-weight:800;font-size:12px;background:var(--panel2);color:var(--text);margin-left:4px;cursor:pointer}
  .mini.on{background:var(--yellow);color:#1a1400}
  .mini.hidden{display:none}
  .offer{display:none;width:100%;border:0;border-radius:14px;padding:10px 12px;margin-bottom:8px;font-weight:800;font-size:14px;background:linear-gradient(90deg,#5a2a10,#3a1f40);color:#fff;text-align:left;cursor:pointer;animation:softpulse 2s ease-in-out infinite}
  .offer.show{display:block}

  .dlg p{color:var(--text)!important;font-size:15px!important}
  .sum{background:#11141a;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px;line-height:1.6}
  #mpAv img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#f5e6cc;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);display:block}
  .bubrow{display:flex;gap:6px;align-items:flex-end}
  .cav{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#f5e6cc;flex:none;border:2px solid #fff}
  .pimg{width:104px;height:104px;object-fit:contain;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}

  html,body{height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}

(function(){
/* ===== TIME: 1 real second = 1 game minute; day 07:00–23:00 ===== */
const DAY_START=420, BEDTIME=1380;
const GAME_VERSION=2, NATIVE_VERSION=1;
const UPDATE_BASE='https://raw.githubusercontent.com/sholohoff-tech/blackout-live/main/';
const isNative=()=>{ try{ return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()); }catch(e){ return false; } };
function buzz(k){
  try{ const H=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Haptics;

  }catch(e){} }

const DF=()=>DIFF[S.diff]||DIFF.normal;
function genPlan(day){
  const f=Math.max(.3,DF().light-Math.min(day-1,6)*.03);
  const out=[]; let light=Math.random()<f;
  while(out.length<24){ let len; if(light) len=3+Math.floor(Math.random()*3); else { const avgD=4*(1-f)/f; len=Math.max(1,Math.round(avgD+(Math.random()*2-1))); }
    for(let i=0;i<len&&out.length<24;i++) out.push(light); light=!light; }
  if(day<=2) for(let h=7;h<=10;h++) out[h]=true;
  return out;
}
function genActual(plan,day){
  const a=[...plan]; if(day<=1) return a;
  const n=1+(Math.random()<.5?1:0);
  for(let k=0;k<n;k++){ const h=9+Math.floor(Math.random()*12); const len=1+Math.floor(Math.random()*2); for(let i=0;i<len&&h+i<24;i++) a[h+i]=!a[h+i]; }
  return a;
}
function newDaySchedule(){ S.plan=genPlan(S.day); S.sched=genActual(S.plan,S.day); S.known=[]; S.warned={}; }

const batMult=b=>b==='powerbank'?PB_MULT[pbLvl()]:ST_MULT;
function srcOK(k){ const s=S.dev[k].sock; if(!s) return false; const so=sock(s); if(so.bat) return visible(so.bat)&&(S.dev[so.bat].c>0||srcOK(so.bat)); return isLight(); }

function plugSpot(k){

let toastT; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
let AC=null;
function tone(type,f1,f2,dur,vol){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.connect(g); g.connect(AC.destination); const n=AC.currentTime; o.type=type; o.frequency.setValueAtTime(f1,n); o.frequency.exponentialRampToValueAtTime(f2,n+dur*.8); g.gain.setValueAtTime(vol,n); g.gain.exponentialRampToValueAtTime(.001,n+dur); o.start(n); o.stop(n+dur+.01); }catch(e){} }
const BUZZ={plug:'light',unplug:'light',sel:'light',on:'med',off:'med',err:'err',merge:'heavy',quest:'ok',eat:'light',pop:'light'};
function snd(t){ if(BUZZ[t]&&!(S&&S.noHaptics)) buzz(BUZZ[t]);
  if(t==='plug') tone('square',180,60,.08,.22);
  else if(t==='unplug') tone('square',90,260,.07,.16);
  else if(t==='sel') tone('sine',660,700,.08,.1);
  else if(t==='on') tone('triangle',300,900,.35,.18);
  else if(t==='off') tone('sawtooth',400,50,.45,.13);
  else if(t==='err') tone('square',120,110,.15,.1);
  else if(t==='msg'){ tone('sine',880,1200,.12,.1); setTimeout(()=>tone('sine',1200,1500,.1,.08),110); }
  else if(t==='meow') tone('sawtooth',700,450,.35,.08);
  else if(t==='merge'){ tone('triangle',400,800,.15,.16); setTimeout(()=>tone('triangle',600,1400,.25,.16),140); }
  else if(t==='pop') tone('sine',500+Math.random()*300,900,.1,.1);
  else if(t==='boil') tone('triangle',900,1800,.6,.08);
  else if(t==='eat'){ tone('sine',300,500,.12,.12); setTimeout(()=>tone('sine',350,600,.12,.12),140); }
  else if(t==='step') tone('sine',220+Math.random()*40,180,.06,.06);
  else if(t==='quest') [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone('triangle',f,f*1.01,.18,.13),i*110));
}

let NR={};
function nv(d,reason){ S.nerves=clamp(S.nerves+d); if(S.day===1) S.nerves=Math.max(20,S.nerves); NR[reason]=(NR[reason]||0)+d; }
function flushNerves(){
  const arr=Object.entries(NR).filter(([,v])=>Math.abs(v)>=0.8).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,2); NR={};
  arr.forEach(([r,v],i)=>setTimeout(()=>{ const f=document.createElement('div'); f.className='nfloat '+(v<0?'minus':'plus'); f.textContent=(v>0?'+':'−')+Math.round(Math.abs(v))+' '+r; $('nBox').appendChild(f); setTimeout(()=>f.remove(),2100); },i*600));
}

/* ===== message queue ===== */
let msgQ=[], msgBusy=false, chatOpen=false;
function pop(av,from,text,info,img){ msgQ.push({av,from,text,info,img}); if(!msgBusy) nextMsg(); }
function nextMsg(){
  const p=$('msgpop'); const m=msgQ.shift();
  if(!m){ msgBusy=false; p.classList.remove('show'); return; }
  msgBusy=true; const show=()=>{ if(m.img&&IMG[m.img]) $('mpAv').innerHTML='<img src="'+IMG[m.img]+'">'; else $('mpAv').textContent=m.av; $('mpFrom').textContent=m.from; $('mpTxt').innerHTML=m.text; p.classList.toggle('info',!!m.info); p.classList.add('show'); if(!m.info) snd('msg');
    setTimeout(()=>{ p.classList.remove('show'); setTimeout(nextMsg,450); }, m.info?6000:4800); };

const CAT={x:190,y:378,dir:1,mode:'sleep',tx:190,ty:378,target:null,gnaw:0};
function catSpot(id){ const s=sock(id); return s.wall?{x:s.x+(s.x<130?24:-24),y:322}:{x:Math.min(330,Math.max(30,s.x)),y:Math.min(424,s.y+14)}; }
const inRoom=()=>S.view==='apt'&&S.scene==='room';
function catTick(dt){
  if(!S.catLvl){ CAT.mode='hidden'; return; }
  if(CAT.mode==='hidden'){ CAT.x=-30; CAT.y=378; goHome(); }
  if(CAT.mode==='sleep'){ S.catT-=dt;
    if(S.catT<=0){ const opts=sceneDevs('room').filter(k=>plugged(k));
      if(opts.length){ const k=opts[Math.floor(Math.random()*opts.length)]; CAT.target=k; const sp=catSpot(S.dev[k].sock); CAT.tx=sp.x; CAT.ty=sp.y; CAT.mode='go'; if(inRoom()) snd('meow'); else toast('😼 Вольт у кімнаті щось задумав!'); }
      S.catT=(40+Math.random()*30)/DF().drain; } }
  if(CAT.mode==='go'||CAT.mode==='walkhome'||CAT.mode==='run'){
    const sp=CAT.mode==='run'?150:CAT.mode==='go'?(inRoom()?34:20):50;
    const dx=CAT.tx-CAT.x,dy=CAT.ty-CAT.y,d=Math.hypot(dx,dy);
    if(Math.abs(dx)>1) CAT.dir=dx>0?1:-1;
    if(d<2){ CAT.x=CAT.tx; CAT.y=CAT.ty;
      if(CAT.mode==='go'){ if(CAT.target&&plugged(CAT.target)){ CAT.mode='gnaw'; CAT.gnaw=2.8*DF().time*(inRoom()?1:1.8); } else goHome(); }
      else if(CAT.mode==='run') goHome(); else CAT.mode='sleep';
    } else { CAT.x+=dx/d*Math.min(d,sp*dt); CAT.y+=dy/d*Math.min(d,sp*dt); } }
  if(CAT.mode==='gnaw'){ CAT.gnaw-=dt;
    if(CAT.gnaw<=0){ const k=CAT.target; if(k&&plugged(k)){ S.dev[k].sock=null; snd('unplug'); toast('😼 Вольт витягнув вилку: '+NAMES[k]+'. Без докорів сумління.'); buzz('heavy'); nv(-4,'кіт'); } goHome(); } }
}

function renderCat(){
  if(!inRoom()) return;
  const on=!!S.catLvl; ['cat','catHit'].forEach(k=>R[k].setAttribute('visibility',on?'visible':'hidden'));
  if(!on){ R.catEyes.setAttribute('visibility','hidden'); R.catBub.setAttribute('visibility','hidden'); return; }
  const moving=CAT.mode==='go'||CAT.mode==='walkhome'||CAT.mode==='run';
  const now=performance.now(), fast=CAT.mode==='run', per=fast?55:95;
  const ph=now/per, stepA=Math.abs(Math.sin(ph));
  let bob=0, rot=0, sx=1, sy=1;
  if(moving){ bob=-stepA*(fast?4:2.5); rot=Math.sin(ph)*(fast?6:4); sy=1-(1-stepA)*(fast?.07:.05); sx=1+(1-stepA)*(fast?.05:.03); }
  else if(CAT.mode==='gnaw'){ rot=Math.sin(now/45)*3.5; sy=1+Math.sin(now/90)*.03; }
  else if(CAT.mode==='sleep'){ sy=1+Math.sin(now/700)*.025; sx=1-Math.sin(now/700)*.012; }
  const spr=CAT.mode==='sleep'?'cat_sleep':CAT.mode==='gnaw'?'cat_gnaw':CAT.mode==='run'?'cat_run':'cat_walk';

/* ===== simulation (h = game hours) ===== */
function simStep(h){
  const D=S.dev,O=S.owned,dr=DF().drain;
  if(srcOK('phone')){ const g=Math.min(55*h,100-D.phone.c); D.phone.c+=g; draw('phone',g+4*h); } else D.phone.c-=10*dr*h;
  if(srcOK('router')){ draw('router',5*h); if(O.ups){ const g=Math.min(55*h,100-D.router.c); D.router.c+=g; draw('router',g*.3); } }
  else if(O.ups&&D.router.c>0) D.router.c-=8*dr*h;
  const lp=srcOK('laptop');
  if(D.laptop.work&&(lp||D.laptop.c>0)&&S.t<BEDTIME&&S.t>=DAY_START){ const e=(routerPowered()?30:10)*DF().rew*nMult()*h; S.money+=e; S.earned+=e; S.qEarn+=e; S.ds.earned+=e; if(!lp) D.laptop.c-=18*dr*h; else draw('laptop',18*h); }
  if(lp){ const g=Math.min(40*h,100-D.laptop.c); D.laptop.c+=g; draw('laptop',g); }
  if(S.pbs.length&&srcOK('powerbank')){ const m=PB_MULT[pbLvl()]; const g=Math.min(70/m*h,100-D.powerbank.c); D.powerbank.c+=g; draw('powerbank',g*m); }
  if(O.station&&srcOK('station')) D.station.c+=Math.min(30*h,100-D.station.c);
  if(O.solar&&O.station&&hour()>=8&&hour()<18) D.station.c+=8*h;
  if(S.kitchen){
    if(srcOK('fridge')){ D.fridge.c+=50*h; draw('fridge',12*h); } else D.fridge.c-=7*dr*h;
    if(D.fridge.c<=0&&(S.groc>0||S.por>0)){ S.spoil+=h; if(S.spoil>=1){ S.spoil=0; if(S.por>0){ S.por--; S.spoiled++; } else if(S.groc>0){ S.groc--; S.spoiled++; } nv(-3,'зіпсована їжа'); } }
    S.food=Math.max(0,S.food-5*dr*h);
    if(S.food<25&&S.t>=DAY_START){ nv(-6*h,'голод'); S.ds.hungry=true; }
  }
  Object.values(D).forEach(d=>d.c=clamp(d.c));
  if(D.phone.c<=0&&S.t>=DAY_START&&S.t<BEDTIME){ nv(-25*h,'сів телефон'); S.ds.phoneDied=true; }
  if(D.laptop.work&&!lp&&D.laptop.c<=0&&S.t<BEDTIME) nv(-8*h,'ноут сів');
  if(isLight()&&S.t>=DAY_START&&S.t<BEDTIME) nv(3*h,'світло є');
  if(!isLight()) S.darkMin+=h*60;
  S.t+=h*60;
}
let wasLight=null, nfT=0, lastSave=0;
function tick(realDt){
  if(S.paused||S.prologue) { if(S.prologue) render(); return; }
  const simDt=realDt*S.speed; const h=simDt/60;
  if(S.t+simDt>=BEDTIME){ S.t=BEDTIME; S.speed=1; bedtime(); return; }
  simStep(h);
  const L=isLight();
  if(wasLight!==null&&L!==wasLight){ snd(L?'on':'off');
    const surprise=S.sched[hour()]!==S.plan[hour()]&&!S.known[hour()];
    toast(L?(surprise?'💡 Світло дали раніше! Щастя без графіка':'💡 Світло дали! Все на зарядку!'):(surprise?'⚠️ Позапланове відключення! Графік — то просто думка':'🌑 Вимкнули. Тримаємося.'));
    if(L) S.speed=Math.min(S.speed,2);
    if(Math.random()<.5) setTimeout(()=>flavor(L),1500); if(S.view==='building') buildScene(); }
  wasLight=L;
  // Galya: reveals actual schedule ~60 min ahead
  const nh=hour()+1;
  if(nh<23&&S.t>=nh*60-60&&!S.warned[nh]){ S.warned[nh]=true; S.known[nh]=true; S.known[nh+1]=true;
    const now=S.sched[hour()], nxt=S.sched[nh];
    if(nxt!==now){ const unplanned=nxt!==S.plan[nh];
      if(!nxt) say('galya',unplanned?'⚠️ Діти, графік поміняли! О '+nh+':00 вимкнуть, хоч і не мали. Кума сказала. Заряджайтеся!':['Через годину вимкнуть. Баба знає 🙏','Чую — щось гуде в щитку. О '+nh+':00 вимкнуть!','Павербанки на зарядку, бо о '+nh+':00 знову темно!'][Math.floor(Math.random()*3)]);
      else if(unplanned) say('galya','Новина! Дадуть раніше, о '+nh+':00. Готуйте чайники!'); } }
  // offers
  const evOn=(S.ch===0&&S.q>=2)||(S.ch===1&&S.q>=4)||S.ch>=2;
  if(S.offer&&S.t>S.offer.until){ toast('Подію пропущено — хтось інший допоміг. Або ні.'); S.offer=null; S.nextOffer=S.t+100+Math.random()*80; }
  if(evOn&&!S.offer&&S.t>=S.nextOffer&&S.t<1290){ const recent=S.lastEv||[]; const pool=EVENTS.filter(e=>!recent.includes(e.id)); const ev=pool[Math.floor(Math.random()*pool.length)]; S.lastEv=[...recent,ev.id].slice(-3); S.offer={id:ev.id,until:S.t+60}; snd('msg'); if(S.speed>1) S.speed=1; }
  // kitchen realtime
  if(S.kitchen){
    if(S.kettle.boil>0){ if(!srcOK('kettle')){ S.kettle.boil=0; toast('Чайник не встиг закипіти. Класика 😔'); } else { S.kettle.boil-=realDt; if(S.kettle.boil<=0){ S.kettle.cool=15; S.teas++; S.ds.teas++; nv(10,'чай'); toast('🍵 Чай готовий. Ааах…'); checkQuest(); } } }
    if(S.kettle.cool>0) S.kettle.cool-=realDt;
    if(S.spoiled>0){ toast('🤢 Щось зіпсувалось у теплому холодильнику'); S.spoiled=0; }
  }
  if(S.nerves<=0&&S.day>1){ breakdown(); return; }
  catTick(realDt);
  nfT+=realDt; if(nfT>=2){ nfT=0; flushNerves(); }
  checkQuest(); render();
  lastSave+=realDt; if(lastSave>3){ lastSave=0; save(); }
}
function fastForward(hours){ const step=5/60; let n=Math.round(hours/step); while(n-->0&&S.t<BEDTIME) simStep(step); }
function breakdown(){
  S.paused=true;
  openModal(`<h2>🤯 Зрив</h2><p>Ти сів у куток і їв сирий пельмень. Потім ще один. Минуло дві години.</p><div class="sum">−50 ₴ на заспокійливий чай<br>Нерви відновлено до 35</div><button class="btn big gloss" id="ok">Встати з кутка</button>`);
  $('ok').onclick=()=>{ fastForward(2); S.nerves=35; S.money=Math.max(0,S.money-50); closeModal(); };

function sleepNight(){
  S.slept++; S.dayOver=true;
  if(dailyMode()) S.daily.forEach(d=>{ if(d.done) return; const def=DAILY.find(x=>x.id===d.id); if(def.end&&def.v()>=1){ d.done=true; rewardMoney(80); } });
  const dd=S.daily.filter(d=>d.done).length;
  const stats={earned:Math.floor(S.earned),dark:Math.round(S.darkMin/60),wins:S.wins,cooks:S.ds.cooks};
  checkQuest();
  // night: rest of today, then tomorrow 00–07
  const before={ph:S.dev.phone.c, groc:S.groc+S.por};
  S.t=Math.max(S.t,BEDTIME); let lightH=0; const step=5/60;
  while(S.t<1440){ simStep(step); if(isLight()) lightH+=step; }
  S.day++; S.t=0; newDaySchedule(); S.darkMin=0;
  while(S.t<DAY_START){ simStep(step); if(isLight()) lightH+=step; }
  let late=false; if(S.dev.phone.c<=0){ late=true; S.t=540; }
  NR={}; nv(25,'сон'); S.food=Math.max(0,S.food);
  const spoiled=before.groc-(S.groc+S.por);
  const share=`⚡ Блекаут · День ${S.day-1} ${DF().ic}\n🌑 Без світла: ${stats.dark} год\n💰 Заробив: ${stats.earned} ₴\n🍲 Приготовано страв: ${stats.cooks}\n🐈 Кота прогнано: ${S.shooed} раз\nВистояв 💪 А ти скільки протримаєшся?`;
  const html=`<h2>☀️ Ранок. День ${S.day}</h2>
    <div class="sum"><b>Поки ти спав:</b><br>💡 Світло давали ${Math.round(lightH)} год із 8<br>📱 Телефон: ${Math.round(before.ph)}% → ${Math.round(S.dev.phone.c)}%${late?'<br>⏰ <b style="color:var(--red)">Телефон сів — будильник мовчав. Проспав до 09:00</b>':''}${S.kitchen?'<br>🧊 '+(spoiled>0?'<b style="color:var(--red)">Зіпсувалось: '+spoiled+'</b>':'Їжа ціла'):''}<br>😴 Нерви +25</div>
    <div class="stat"><span>Учора заробив</span><b>${stats.earned} ₴</b></div><div class="stat"><span>Без світла вдень</span><b>${stats.dark} год</b></div>${dailyMode()?`<div class="stat"><span>Завдань дня</span><b>${dd}/${S.daily.length}</b></div>`:''}
    <div class="sharebox">${share}</div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="cp">📋 Поділитись</button><button class="btn buy gloss" id="nd">Новий день →</button></div>`;
  const show=()=>{ openModal(html);
    $('cp').onclick=()=>{ try{ navigator.clipboard.writeText(share).then(()=>toast('Скопійовано!'),()=>toast('Не вдалося скопіювати')); }catch(e){ toast('Не вдалося скопіювати'); } };
    $('nd').onclick=()=>{ S.earned=0; S.wins=0; S.ds=freshDs(); S.dayOver=false; S.offer=null; S.nextOffer=S.t+90; S.kettle={boil:0,cool:0};
      if(dailyMode()) genDaily();
      let intro=null;
      if(S.ch>=1&&!S.kitchen){ S.kitchen=true; S.dev.fridge.c=60; intro=()=>say('galya','Доброго ранку! Глянь, у тебе ж кухня є 🍳 Ходімо, покажу, що там до чого.'); }
      buildSched(); buildScene(); wasLight=null; closeModal(); toast('Новий графік. Плановий. Нібито 📋');
      setTimeout(intro||(()=>say('osbb',['Новий графік у закріпі 📌 Тримаймося, сусіди!','Доброго ранку! Графік у закріпі. Віра — у серці.','Нагадуємо: генератор у дворі — не лавочка.'][Math.floor(Math.random()*3)])),1200); }; };
  if(S.ch>=1&&S.chEndShown<0){ S.chEndShown=0; chapterEnd(0,show); } else show();
}

}

function mgMatch3(done,ev){
  mgStop(); const my=mgId;
  const others=['🔦','🔋','📱','🧦','🍪','🔌'].filter(x=>x!==ev.item);
  const T=[ev.item,...others.slice(0,4)], N=6, GOAL=8+lvl()*2, SEC=32*tmul(), CS=100/N;
  let grid=[],sel=null,got=0,over=false,busy=false;
  openModal(`<h2>${ev.item} Збери: <span id="kc">0</span>/${GOAL}</h2><div class="timer" id="tb"><i></i></div><div class="m3b" id="m3"></div><div class="combo" id="combo"></div><p style="text-align:center;margin-top:8px">Свайпни фішку або торкнись двох сусідніх</p>`);
  const board=$('m3'), alive=()=>my===mgId&&!over, rnd=()=>Math.floor(Math.random()*T.length);
  function mk(t,r,c,fromR){ const d=document.createElement('div'); d.className='tile'; d.innerHTML='<span>'+T[t]+'</span>'; d.style.left=c*CS+'%'; d.style.top=(fromR==null?r:fromR)*CS+'%'; d.style.width=d.style.height=CS+'%'; board.appendChild(d); return {t,r,c,el:d}; }
  function pos(o,r,c){ o.r=r; o.c=c; o.el.style.left=c*CS+'%'; o.el.style.top=r*CS+'%'; }
  for(let r=0;r<N;r++){ grid[r]=[]; for(let c=0;c<N;c++){ let v; do{ v=rnd(); }while((c>1&&grid[r][c-1].t===v&&grid[r][c-2].t===v)||(r>1&&grid[r-1][c].t===v&&grid[r-2][c].t===v)); grid[r][c]=mk(v,r,c); } }
  function at(x,y){ const b=board.getBoundingClientRect(); const c=Math.floor((x-b.left)/b.width*N), r=Math.floor((y-b.top)/b.height*N); return (r>=0&&r<N&&c>=0&&c<N)?[r,c]:null; }
  function matches(){ const m=new Set();
    for(let r=0;r<N;r++){ let run=1; for(let c=1;c<=N;c++){ if(c<N&&grid[r][c]&&grid[r][c-1]&&grid[r][c].t===grid[r][c-1].t) run++; else { if(run>=3) for(let k=c-run;k<c;k++) m.add(grid[r][k]); run=1; } } }
    for(let c=0;c<N;c++){ let run=1; for(let r=1;r<=N;r++){ if(r<N&&grid[r][c]&&grid[r-1][c]&&grid[r][c].t===grid[r-1][c].t) run++; else { if(run>=3) for(let k=r-run;k<r;k++) m.add(grid[k][c]); run=1; } } }
    return m; }
  async function swap(a,b){ busy=true; const [ar,ac]=[a.r,a.c],[br,bc]=[b.r,b.c];
    grid[ar][ac]=b; grid[br][bc]=a; pos(a,br,bc); pos(b,ar,ac); snd('sel');
    await sleep(190); if(!alive()) return;
    if(matches().size) await cascade(); else { grid[ar][ac]=a; grid[br][bc]=b; pos(a,ar,ac); pos(b,br,bc); snd('err'); await sleep(190); }
    busy=false; }
  async function cascade(){ let chain=0;
    while(alive()){ const m=matches(); if(!m.size) break; chain++;
      if(chain>1){ const cb=$('combo'); if(cb){ cb.textContent='Комбо ×'+chain+'!'; cb.classList.remove('show'); void cb.offsetWidth; cb.classList.add('show'); } }
      m.forEach(o=>{ if(o.t===0) got++; o.el.classList.add('pop'); grid[o.r][o.c]=null; });
      snd('pop'); const kc=$('kc'); if(kc) kc.textContent=Math.min(got,GOAL);
      await sleep(200); if(!alive()) return;
      m.forEach(o=>o.el.remove());
      for(let c=0;c<N;c++){ const col=[]; for(let r=N-1;r>=0;r--) if(grid[r][c]) col.push(grid[r][c]); let r=N-1; col.forEach(o=>{ grid[r][c]=o; pos(o,r,c); r--; }); let sp=-1; for(;r>=0;r--){ grid[r][c]=mk(rnd(),r,c,sp--); } }
      void board.offsetHeight; for(let r=0;r<N;r++) for(let c=0;c<N;c++) pos(grid[r][c],r,c);
      await sleep(260); if(!alive()) return;
      if(got>=GOAL){ over=true; await sleep(250); done(true); return; } } }
  let st=null;
  board.addEventListener('pointerdown',e=>{ if(busy||over) return; const p=at(e.clientX,e.clientY); if(p) st={x:e.clientX,y:e.clientY,p}; });
  board.addEventListener('pointerup',e=>{ if(busy||over||!st) return; const dx=e.clientX-st.x, dy=e.clientY-st.y; const [r,c]=st.p; st=null;
    if(Math.hypot(dx,dy)>18){ let tr=r,tc=c; if(Math.abs(dx)>Math.abs(dy)) tc+=dx>0?1:-1; else tr+=dy>0?1:-1; if(tr<0||tr>=N||tc<0||tc>=N) return; if(sel){ sel.el.classList.remove('sel'); sel=null; } swap(grid[r][c],grid[tr][tc]); return; }
    const o=grid[r][c]; if(!sel){ sel=o; o.el.classList.add('sel'); return; } if(sel===o){ o.el.classList.remove('sel'); sel=null; return; }
    if(Math.abs(sel.r-o.r)+Math.abs(sel.c-o.c)===1){ const a=sel; a.el.classList.remove('sel'); sel=null; swap(a,o); } else { sel.el.classList.remove('sel'); sel=o; o.el.classList.add('sel'); } });
  runTimer(SEC,()=>over,()=>{ over=true; done(false); });
}
function mgGen(done,ev){
  mgStop();
  const need=3+(lvl()>=3?1:0); let hits=0,miss=0,pos=0,dir=1,speed=(0.9+lvl()*.15)/tmul(),zs=0,zw=22,over=false;
  const newZone=()=>{ zw=Math.max(10,(24-hits*4-lvl()*1.5)*tmul()); zs=5+Math.random()*(90-zw); }; newZone();

  const zone=$('zone'),mk=$('mk'); const place=()=>{ zone.style.left=zs+'%'; zone.style.width=zw+'%'; }; place();
  let last=performance.now();
  function frame(now){ if(over) return; const d=(now-last)/16.7; last=now; pos+=dir*speed*d; if(pos>=100){pos=100;dir=-1;} if(pos<=0){pos=0;dir=1;} mk.style.left=pos+'%'; mgTimers.push(requestAnimationFrame(frame)); }
  mgTimers.push(requestAnimationFrame(frame));
  $('pull').onclick=()=>{ if(over) return;
    if(pos>=zs&&pos<=zs+zw){ hits++; speed+=.4; $('gh').textContent=hits; snd('plug'); toast(hits>=need?(ev.id==='breaker'?'Клац! Світло є 🎉':'ДРРРРР! 🎉'):['Чхх…','Чхх-чхх…','Майже…'][Math.min(hits-1,2)]); if(hits>=need){ over=true; setTimeout(()=>done(true),500); return; } newZone(); place(); }
    else { miss++; $('gm').textContent=miss; snd('err'); if(miss>2){ over=true; done(false); } } };
}

function stairPath(fromF,toF){
  const pts=[]; const N=18;
  for(let f=fromF;f<toF;f++){ const yb=FL_Y[f-1]+60;
    for(let k=0;k<=N;k++){ pts.push([150+k*(26/N), yb-k*(33/N)]); }

  }
  return pts;
}

    const html=await g.text();
    if(html.indexOf('GAME_VERSION='+v.version+',')<0) throw new Error('bad file');
    localStorage.setItem('bo_game',JSON.stringify({v:v.version,html}));
    showUpdate(`<h2>🔄 Оновлення v${v.version} готове</h2><p>${v.notes||'Нові штуки й виправлення.'}</p><p>Прогрес збережеться.</p><div class="row"><button class="btn ghost" id="ulater">Пізніше</button><button class="btn buy gloss" id="unow">Перезапустити</button></div>`);
  }catch(e){ if(manual) toast('Не вдалося перевірити оновлення: '+(e.message||e)); }
}
function showUpdate(html){
  const go=()=>{ if(modalOpen){ setTimeout(go,3000); return; } openModal(html);
    if($('uok')) $('uok').onclick=closeModal;
    if($('ulater')) $('ulater').onclick=()=>{ closeModal(); toast('Оновлення застосується при наступному запуску'); };
    if($('unow')) $('unow').onclick=()=>{ save(); location.reload(); }; };
  go();
}
window.__checkUpdate=checkUpdate;
setTimeout(()=>checkUpdate(false),6000);
try{ const CapApp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(CapApp) CapApp.addListener('resume',()=>checkUpdate(false)); }catch(e){}
try{ const CapApp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(CapApp) CapApp.addListener('backButton',()=>{
    if($('picker').classList.contains('open')){ $('picker').classList.remove('open'); return; }
    if(modalOpen){ const b=$('card').querySelector('#closeShop,#cl,#cd,#closeChat,#cc,#resume,#later,#no,#skip,#ok'); if(b) b.click(); return; }
    if(!S.prologue) pauseMenu('Гру збережено. Можна спокійно виходити — Вольт посторожить.');
  }); }catch(e){}
window.addEventListener('resize',renderSpot); window.addEventListener('scroll',renderSpot,{passive:true});
const saved=load();
if(saved){ S=saved; S.paused=false; if(S.prologue){ S=fresh(S.diff); boot(); runPrologue(); } else boot(); }
else { S=fresh('normal'); S.paused=true; boot(); chooseDifficulty(); }
let lastT=performance.now();
let errShown=0;
setInterval(()=>{ const now=performance.now(); const dt=Math.min(0.5,(now-lastT)/1000); lastT=now;
  // watchdog: pause is only valid while a window is open or during the prologue
  if(S.paused&&!modalOpen&&!S.prologue) S.paused=false;
  try{ tick(dt); }catch(e){ console.error(e); if(now-errShown>8000){ errShown=now; toast('⚠️ Помилка: '+(e.message||e)+' — скинь скрін'); } }
},100);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ save(); if(!modalOpen&&!S.prologue) pauseMenu('З поверненням! Поки тебе не було, час чекав. Чемний.'); }
});
})();

</script>
