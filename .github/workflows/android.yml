name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'game.html', 'version.json', 'README.md' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install JS dependencies
        run: npm ci

      - name: Copy game into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk blackout.apk

      - uses: actions/upload-artifact@v4
        with:
          name: blackout-alpha-${{ github.run_number }}
          path: blackout.apk

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-${{ github.run_number }}
          name: Блекаут alpha ${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: blackout.apk
